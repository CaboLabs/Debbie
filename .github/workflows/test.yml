name: Run Debbie Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ secrets.DB_TEST_NAME }}
          MYSQL_USER: ${{ secrets.DB_TEST_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_TEST_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run Debbie tests
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_NAME: ${{ secrets.DB_TEST_NAME }}
          DB_TEST_USER: ${{ secrets.DB_TEST_USER }}
          DB_TEST_PASS: ${{ secrets.DB_TEST_PASS }}
        run: |
          # Run your test suite and generate JUnit XML
          php cli.php tests -report=junit
          # --file=test-results.xml
        continue-on-error: true
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: Debbie Test Results
